name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solar_assistant_monitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: solar_assistant_monitor/go.mod
          cache-dependency-path: solar_assistant_monitor/go.sum
      - run: gofmt -w cmd internal && git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pip install yamllint
      - run: yamllint .

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Run browser integration test in Chromium
        if: matrix.platform == 'linux/amd64'
        uses: docker/build-push-action@v7
        with:
          context: solar_assistant_monitor
          target: test
          platforms: linux/amd64
          push: false
          tags: local/solar-assistant-monitor:test
      - uses: docker/build-push-action@v7
        with:
          context: solar_assistant_monitor
          platforms: ${{ matrix.platform }}
          push: false
          tags: local/solar-assistant-monitor:ci
          build-args: |
            BUILD_ARCH=${{ matrix.platform == 'linux/arm64' && 'aarch64' || 'amd64' }}
            BUILD_VERSION=0.1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
